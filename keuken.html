<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keuken Dashboard | Brodshoes</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:      #1e3a3f;
      --teal-dark: #162d31;
      --red:       #e85d4a;
      --cream:     #e8dcc8;
      --green:     #2d7a3a;
      --border:    #d0c4ae;
      --text:      #2c2c2c;
      --muted:     #888;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Login ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }

    .login-card {
      background: var(--teal); color: #fff;
      padding: 52px 48px; max-width: 380px; width: 100%; text-align: center;
    }

    .login-card h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px; margin-bottom: 6px;
    }

    .login-card p {
      font-size: 13px; color: rgba(255,255,255,0.6);
      margin-bottom: 28px; letter-spacing: 1px; text-transform: uppercase;
    }

    .login-card input {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff; font-size: 15px; font-family: 'Lato', sans-serif;
      outline: none; margin-bottom: 14px; text-align: center; letter-spacing: 3px;
    }

    .login-card input::placeholder { color: rgba(255,255,255,0.4); letter-spacing: 1px; }

    .login-card button {
      width: 100%; padding: 13px; background: var(--red); color: #fff; border: none;
      font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
      cursor: pointer; font-family: 'Lato', sans-serif;
    }

    .login-card button:hover { background: #d04838; }
    .login-fout { color: #ff9090; font-size: 13px; margin-top: 10px; display: none; }

    /* ── Dashboard ── */
    #dashboard { display: none; }

    .topbar {
      background: var(--teal); color: #fff;
      padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
    }

    .topbar-left { display: flex; align-items: center; gap: 20px; }
    .topbar-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; letter-spacing: 2px; }
    .topbar-sub { font-size: 11px; color: rgba(255,255,255,0.55); letter-spacing: 1.5px; text-transform: uppercase; }

    .topbar-acties { display: flex; gap: 10px; align-items: center; }

    .btn-print {
      padding: 9px 18px; background: transparent; color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.3); font-size: 11px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: 'Lato', sans-serif;
    }

    .btn-refresh {
      padding: 9px 18px; background: var(--red); color: #fff; border: none;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; font-family: 'Lato', sans-serif;
    }

    .filter-bar {
      background: var(--teal-dark); padding: 12px 32px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }

    .filter-bar label { font-size: 11px; color: rgba(255,255,255,0.55); letter-spacing: 1px; text-transform: uppercase; }

    .filter-bar select {
      padding: 7px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; font-size: 13px; font-family: 'Lato', sans-serif; outline: none;
    }

    .filter-bar select option { background: var(--teal); }

    .content { padding: 28px 32px; }

    /* ── Stat tiles ── */
    .stat-rij {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px;
    }

    .stat-tile {
      background: #fff; border: 1px solid var(--border); padding: 18px 20px;
    }

    .stat-tile-label {
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
    }

    .stat-tile-waarde {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px; font-weight: 700; color: var(--teal);
    }

    /* ── Product totalen ── */
    .sectie-titel {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px; font-weight: 700; color: var(--teal);
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }

    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px; margin-bottom: 32px;
    }

    .product-tile {
      background: #fff; border: 1px solid var(--border); padding: 16px 18px;
    }

    .product-tile-naam {
      font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text); margin-bottom: 8px;
    }

    .product-tile-cat {
      font-size: 11px; color: var(--muted); margin-bottom: 10px; letter-spacing: 0.5px;
    }

    .product-tile-qty {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px; font-weight: 700; color: var(--teal); line-height: 1;
    }

    .product-tile-unit { font-size: 13px; color: var(--muted); margin-left: 4px; }

    .progress-balk {
      height: 6px; background: #e8e0d4; margin-top: 10px; border-radius: 3px; overflow: hidden;
    }

    .progress-fill { height: 100%; background: var(--red); border-radius: 3px; transition: width 0.4s; }

    /* ── Tijdslot overzicht ── */
    .tijdslot-blok {
      background: #fff; border: 1px solid var(--border);
      margin-bottom: 16px; overflow: hidden;
    }

    .tijdslot-header {
      background: var(--teal); color: #fff; padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .tijdslot-naam {
      font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700;
    }

    .tijdslot-count {
      font-size: 12px; color: rgba(255,255,255,0.7); letter-spacing: 1px;
    }

    .tijdslot-body { padding: 0; }

    .tijdslot-rij {
      display: grid; grid-template-columns: 1fr auto auto;
      padding: 11px 20px; border-bottom: 1px solid #ece3d6;
      align-items: center; gap: 12px;
    }

    .tijdslot-rij:last-child { border-bottom: none; }

    .tijdslot-rij-naam { font-size: 13px; font-weight: 600; color: var(--text); }
    .tijdslot-rij-cat  { font-size: 11px; color: var(--muted); }

    .tijdslot-rij-qty {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px; font-weight: 700; color: var(--teal); text-align: right;
    }

    /* ── Allergieën lijst ── */
    .allergie-lijst { display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px; }

    .allergie-rij {
      background: #fff; border: 1px solid var(--border);
      border-left: 4px solid var(--red); padding: 12px 16px;
      display: flex; gap: 14px; align-items: flex-start;
    }

    .allergie-naam { font-weight: 700; font-size: 14px; color: var(--text); min-width: 160px; }
    .allergie-tekst { font-size: 14px; color: var(--text); flex: 1; }
    .allergie-tijdslot { font-size: 12px; color: var(--muted); white-space: nowrap; }

    /* ── Print ── */
    @media print {
      .topbar, .filter-bar, .btn-print, .btn-refresh { display: none !important; }
      body { background: #fff; }
      .content { padding: 0; }
      .tijdslot-blok, .product-tile, .stat-tile { break-inside: avoid; }
    }
  </style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div class="login-card">
    <h1>Brodshoes</h1>
    <p>Keuken Dashboard</p>
    <input type="password" id="keuken-ww" placeholder="Wachtwoord" />
    <button onclick="keukensLogin()">Inloggen</button>
    <div class="login-fout" id="keuken-fout">Onjuist wachtwoord</div>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-left">
      <div>
        <div class="topbar-title">Keuken Dashboard</div>
        <div class="topbar-sub">Brodshoes · Bestellingenoverzicht</div>
      </div>
    </div>
    <div class="topbar-acties">
      <span id="laatste-update" style="font-size:11px;color:rgba(255,255,255,0.5);"></span>
      <button class="btn-refresh" onclick="laadData()">↺ Vernieuwen</button>
      <button class="btn-print" onclick="window.print()">🖨️ Printen</button>
    </div>
  </div>

  <div class="filter-bar">
    <label>Template:</label>
    <select id="dash-template" onchange="laadData()">
      <option value="">Alle templates</option>
    </select>
    <label>Tijdslot:</label>
    <select id="dash-tijdslot" onchange="renderDashboard()">
      <option value="">Alle tijdslots</option>
    </select>
    <label>Status:</label>
    <select id="dash-status" onchange="laadData()">
      <option value="">Alle</option>
      <option value="nieuw">Nieuw</option>
      <option value="in_behandeling">In behandeling</option>
      <option value="klaar">Klaar</option>
    </select>
  </div>

  <div class="content" id="dashboard-content">
    <p style="color:var(--muted)">Laden…</p>
  </div>
</div>

<script>
  const KEUKEN_WW = 'keuken2026';
  const sb = getSbClient();
  let alleData = [];

  function keukensLogin() {
    const ww = document.getElementById('keuken-ww').value;
    if (ww === KEUKEN_WW) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      initialiseer();
    } else {
      document.getElementById('keuken-fout').style.display = 'block';
    }
  }

  document.getElementById('keuken-ww').addEventListener('keydown', e => {
    if (e.key === 'Enter') keukensLogin();
  });

  async function initialiseer() {
    await laadTemplates();
    await laadData();
  }

  async function laadTemplates() {
    const { data } = await sb.from('templates').select('id, naam').eq('status', 'gepubliceerd');
    const select = document.getElementById('dash-template');
    (data || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id; opt.textContent = t.naam;
      select.appendChild(opt);
    });
  }

  async function laadData() {
    const templateId = document.getElementById('dash-template').value;
    const status     = document.getElementById('dash-status').value;

    let query = sb.from('bestellingen').select('*').order('tijdslot');
    if (templateId) query = query.eq('template_id', templateId);
    if (status)     query = query.eq('status', status);

    const { data, error } = await query;
    if (error) { console.error(error); return; }
    alleData = data || [];

    // Vul tijdslot filter
    const tijdslots = [...new Set(alleData.map(b => b.tijdslot).filter(Boolean))].sort();
    const tsSelect  = document.getElementById('dash-tijdslot');
    const huidigTs  = tsSelect.value;
    tsSelect.innerHTML = '<option value="">Alle tijdslots</option>';
    tijdslots.forEach(ts => {
      const opt = document.createElement('option');
      opt.value = ts; opt.textContent = ts;
      if (ts === huidigTs) opt.selected = true;
      tsSelect.appendChild(opt);
    });

    document.getElementById('laatste-update').textContent =
      'Bijgewerkt: ' + new Date().toLocaleTimeString('nl-NL');

    renderDashboard();
  }

  function gefilterd() {
    const ts = document.getElementById('dash-tijdslot').value;
    return ts ? alleData.filter(b => b.tijdslot === ts) : alleData;
  }

  function renderDashboard() {
    const data = gefilterd();
    const el   = document.getElementById('dashboard-content');

    if (!data.length) {
      el.innerHTML = '<p style="color:var(--muted);padding:40px 0;">Geen bestellingen gevonden.</p>';
      return;
    }

    // Bereken product totalen
    const productTotalen = {};
    data.forEach(b => {
      (b.regels || []).forEach(r => {
        if (!productTotalen[r.label]) productTotalen[r.label] = 0;
        productTotalen[r.label] += r.qty;
      });
    });

    const maxQty      = Math.max(...Object.values(productTotalen));
    const totaalOmzet = data.reduce((s, b) => s + (parseFloat(b.totaal) || 0), 0);
    const metOpmerking = data.filter(b => b.opmerking).length;

    // Tijdslot groepen
    const tijdslotGroepen = {};
    data.forEach(b => {
      const ts = b.tijdslot || 'Onbekend';
      if (!tijdslotGroepen[ts]) tijdslotGroepen[ts] = [];
      tijdslotGroepen[ts].push(b);
    });

    // Allergieën
    const allergieën = data.filter(b => b.opmerking);

    el.innerHTML = `
      <!-- Stat tiles -->
      <div class="stat-rij">
        <div class="stat-tile">
          <div class="stat-tile-label">Bestellingen</div>
          <div class="stat-tile-waarde">${data.length}</div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-label">Totaal omzet</div>
          <div class="stat-tile-waarde">€ ${totaalOmzet.toFixed(2).replace('.', ',')}</div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-label">Tijdslots</div>
          <div class="stat-tile-waarde">${Object.keys(tijdslotGroepen).length}</div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-label">Opmerkingen</div>
          <div class="stat-tile-waarde" style="color:${metOpmerking > 0 ? 'var(--red)' : 'var(--teal)'}">${metOpmerking}</div>
        </div>
      </div>

      <!-- Product totalen -->
      <div class="sectie-titel">
        Totaal per product
        <span style="font-size:13px;font-weight:400;color:var(--muted);font-family:'Lato',sans-serif;">${Object.keys(productTotalen).length} producten</span>
      </div>
      <div class="product-grid">
        ${Object.entries(productTotalen).sort((a,b) => b[1]-a[1]).map(([label, qty]) => {
          const pct = Math.round((qty / maxQty) * 100);
          const delen = label.split(' – ');
          const cat = delen[0] || '';
          const prod = delen[1] || label;
          return `<div class="product-tile">
            <div class="product-tile-cat">${cat}</div>
            <div class="product-tile-naam">${prod}</div>
            <div>
              <span class="product-tile-qty">${qty}</span>
              <span class="product-tile-unit">stuks</span>
            </div>
            <div class="progress-balk"><div class="progress-fill" style="width:${pct}%"></div></div>
          </div>`;
        }).join('')}
      </div>

      <!-- Per tijdslot -->
      <div class="sectie-titel">
        Per tijdslot
      </div>
      ${Object.entries(tijdslotGroepen).sort().map(([ts, bests]) => {
        // Bereken per tijdslot product totalen
        const tsProd = {};
        bests.forEach(b => {
          (b.regels || []).forEach(r => {
            if (!tsProd[r.label]) tsProd[r.label] = 0;
            tsProd[r.label] += r.qty;
          });
        });
        return `<div class="tijdslot-blok">
          <div class="tijdslot-header">
            <div class="tijdslot-naam">🕐 ${ts}</div>
            <div class="tijdslot-count">${bests.length} ${bests.length === 1 ? 'bestelling' : 'bestellingen'}</div>
          </div>
          <div class="tijdslot-body">
            ${Object.entries(tsProd).sort((a,b) => b[1]-a[1]).map(([label, qty]) => {
              const delen = label.split(' – ');
              return `<div class="tijdslot-rij">
                <div>
                  <div class="tijdslot-rij-naam">${delen[1] || label}</div>
                  <div class="tijdslot-rij-cat">${delen[0] || ''}</div>
                </div>
                <div class="tijdslot-rij-qty">${qty}×</div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}

      <!-- Allergieën & opmerkingen -->
      ${allergieën.length ? `
        <div class="sectie-titel" style="color:var(--red)">
          ⚠️ Allergieën &amp; opmerkingen
          <span style="font-size:13px;font-weight:400;color:var(--muted);font-family:'Lato',sans-serif;">${allergieën.length} melding${allergieën.length !== 1 ? 'en' : ''}</span>
        </div>
        <div class="allergie-lijst">
          ${allergieën.map(b => `
            <div class="allergie-rij">
              <div class="allergie-naam">${b.voornaam} ${b.achternaam}</div>
              <div class="allergie-tekst">${b.opmerking}</div>
              <div class="allergie-tijdslot">${b.tijdslot || '–'}</div>
            </div>`).join('')}
        </div>` : ''}
    `;
  }
</script>
</body>
</html>
