<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <title>Pasen 2026 – Salade Bestellen | Brodshoes</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --teal:        #1e3a3f;
      --teal-dark:   #e8dcc8;
      --teal-mid:    #254a50;
      --teal-light:  #2e5f67;
      --teal-border: rgba(255,255,255,0.10);
      --red:         #e85d4a;
      --red-hover:   #d04838;
      --white:       #ffffff;
      --text:        #ffffff;
      --text-muted:  rgba(255,255,255,0.55);
      --text-sub:    rgba(255,255,255,0.75);
    }

    body {
      font-family: 'Lato', 'Segoe UI', sans-serif;
      background: var(--teal-dark);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 20px;
      color: var(--text);
    }

    .card {
      background: var(--teal);
      max-width: 580px;
      width: 100%;
      padding: 0;
      border: 1px solid var(--teal-border);
      overflow: hidden;
    }

    .card-inner {
      padding: 56px 52px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 44px;
    }

    .header-tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 52px;
      font-weight: 600;
      color: var(--white);
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .divider-line {
      width: 1px;
      height: 32px;
      background: var(--teal-border);
      margin: 16px auto;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.7;
      font-weight: 300;
    }

    .afhaal-badge {
      display: inline-block;
      margin-top: 18px;
      padding: 8px 20px;
      border: 1px solid var(--teal-border);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-sub);
    }

    /* ── Section headers ── */
    .section-header {
      text-align: center;
      margin: 40px 0 20px;
    }

    .section-header .section-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .section-header h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--white);
    }

    .section-header .divider-line {
      margin-top: 10px;
    }

    /* ── Form groups ── */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--teal-mid);
      border: 1px solid var(--teal-border);
      color: var(--white);
      font-size: 15px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      outline: none;
      transition: border-color 0.2s;
      border-radius: 0;
    }

    input[type="text"]::placeholder,
    input[type="email"]::placeholder,
    input[type="tel"]::placeholder,
    textarea::placeholder {
      color: var(--text-muted);
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    textarea:focus {
      border-color: rgba(255,255,255,0.35);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ── Product rijen ── */
    .product-rij {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--teal-border);
      gap: 16px;
    }

    .product-rij:first-child {
      border-top: 1px solid var(--teal-border);
    }

    .product-info {
      flex: 1;
    }

    .product-omschrijving {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--white);
    }

    .product-prijs {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 17px;
      color: var(--text-sub);
      margin-top: 3px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .qty-btn {
      width: 34px;
      height: 34px;
      background: transparent;
      border: 1px solid var(--teal-border);
      color: var(--text-sub);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      line-height: 1;
      padding: 0;
    }

    .qty-btn:hover {
      background: var(--teal-mid);
      border-color: rgba(255,255,255,0.25);
      color: var(--white);
    }

    .qty-value {
      width: 42px;
      height: 34px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--white);
      background: var(--teal-mid);
      border: 1px solid var(--teal-border);
      border-left: none;
      border-right: none;
      outline: none;
      font-family: 'Lato', sans-serif;
      -moz-appearance: textfield;
    }

    .qty-value::-webkit-outer-spin-button,
    .qty-value::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    /* ── Totaal ── */
    .totaal-balk {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.20);
      padding: 20px 0 0;
      margin: 24px 0 32px;
    }

    .totaal-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .totaal-bedrag {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--white);
    }

    /* ── Submit ── */
    button[type="submit"] {
      width: 100%;
      padding: 16px;
      background: var(--red);
      color: var(--white);
      border: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: 'Lato', sans-serif;
      transition: background 0.2s;
      border-radius: 0;
    }

    button[type="submit"]:hover {
      background: var(--red-hover);
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .deadline-note {
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 14px;
    }

    /* ── Success ── */
    .success {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .success h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 42px;
      font-weight: 600;
      color: var(--white);
      margin: 16px 0 8px;
    }

    .success-details {
      background: var(--teal-mid);
      border: 1px solid var(--teal-border);
      padding: 22px 26px;
      margin: 24px 0;
      font-size: 14px;
      color: var(--text-sub);
      line-height: 2;
      text-align: left;
      font-weight: 300;
    }

    .success-details strong {
      color: var(--white);
      font-weight: 600;
    }

    .success-footer {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .hero-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      object-position: center 40%;
      display: block;
      margin-bottom: 0;
    }

    .footer-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      object-position: center center;
      display: block;
      margin-top: 40px;
    }

    .tijdslot-fout {
      display: none;
      color: #e85d4a;
      font-size: 13px;
      font-weight: 600;
      margin-top: 8px;
    }

    .tijdslot-grid.fout .tijdslot-label {
      border-color: #e85d4a;
    }

    .tijdslot-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .tijdslot-option {
      cursor: pointer;
    }

    .tijdslot-option input {
      display: none;
    }

    .tijdslot-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border: 1px solid var(--teal-border);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-sub);
      background: var(--teal-mid);
      transition: all 0.15s;
      cursor: pointer;
    }

    .tijdslot-option input:checked + .tijdslot-label {
      background: var(--red);
      border-color: var(--red);
      color: var(--white);
    }

    .tijdslot-label:hover {
      border-color: rgba(255,255,255,0.30);
      color: var(--white);
    }

    @media (max-width: 480px) {
      .card-inner { padding: 40px 28px; }
      h1 { font-size: 40px; }
      .two-col { grid-template-columns: 1fr; }
      .tijdslot-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img id="hero-img" src="header.png" alt="Brodshoes interieur" class="hero-img" />
    <div class="card-inner">
    <div id="form-section">

      <!-- Header -->
      <div class="header">
        <div class="header-tag">Brodshoes · <span id="ev-locatie-footer"></span></div>
        <h1 id="ev-titel"></h1>
        <div class="divider-line"></div>
        <p class="subtitle" id="ev-subtitel"></p>
        <div class="afhaal-badge" id="ev-badge"></div>
      </div>

      <form id="bestel-form" onsubmit="handleSubmit(event)">

        <!-- Gegevens -->
        <div class="section-header">
          <h2>Uw gegevens</h2>
          <div class="divider-line"></div>
        </div>

        <div class="two-col">
          <div class="form-group">
            <label for="voornaam">Voornaam</label>
            <input type="text" id="voornaam" placeholder="Jan" required />
          </div>
          <div class="form-group">
            <label for="achternaam">Achternaam</label>
            <input type="text" id="achternaam" placeholder="de Vries" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">E-mailadres</label>
          <input type="email" id="email" placeholder="jan@voorbeeld.nl" required />
        </div>

        <div class="two-col">
          <div class="form-group">
            <label for="telefoon">Telefoonnummer</label>
            <input type="tel" id="telefoon" placeholder="06 12345678" required />
          </div>
          <div class="form-group">
            <label for="adres">Adres &amp; Plaatsnaam</label>
            <input type="text" id="adres" placeholder="Dorpsstraat 1, Rijssen" required />
          </div>
        </div>

        <!-- Producten: dynamisch geladen vanuit config -->
        <div id="stap2-container"></div>

        <!-- Tijdslot -->
        <div class="section-header">
          <div class="section-tag" id="tijdslot-stap-nr" style="display:none"></div>
          <h2>Afhaalmoment</h2>
          <div class="divider-line"></div>
        </div>

        <div class="form-group">
          <label id="tijdslot-label">Kies uw afhaalmoment</label>
          <div class="tijdslot-grid" id="tijdslot-grid"></div>
          <div class="tijdslot-fout" id="tijdslot-fout">Kies een tijdslot om door te gaan</div>
        </div>

        <!-- Totaal -->
        <div class="totaal-balk">
          <span class="totaal-label">Totaal</span>
          <span class="totaal-bedrag" id="totaal-bedrag">€ 0,00</span>
        </div>

        <!-- Opmerking -->
        <div class="form-group">
          <label for="opmerking">Opmerkingen of wensen (optioneel)</label>
          <textarea id="opmerking" placeholder="Bijv. allergieën, speciale wensen..."></textarea>
        </div>

        <button type="submit" id="submit-btn">Bestelling plaatsen</button>
        <p class="deadline-note" id="ev-deadline"></p>
      </form>
    </div>

    <!-- Bevestiging -->
    <div class="success" id="success-section">
      <div class="header-tag" id="ev-locatie-success-tag"></div>
      <h2 id="success-title">Bedankt voor uw bestelling!</h2>
      <div class="divider-line"></div>
      <div class="success-details" id="success-bericht"></div>
      <p class="success-footer" id="ev-locatie-success"></p>
    </div> <!-- /success-section -->
    </div> <!-- /card-inner -->
    <img id="footer-img" src="footer.png" alt="Brodshoes gerechten" class="footer-img" />
  </div>

  <script>
    // ══ Config laden: slug uit URL → Supabase, anders localStorage fallback ══
    const THEMAS = {
      pasen:    { achtergrond: '#e8dcc8', kaart: '#1e3a3f', kaartMid: '#254a50', accent: '#e85d4a' },
      kerst:    { achtergrond: '#1a0a0a', kaart: '#2d0d0d', kaartMid: '#3d1515', accent: '#c9a84c' },
      zomer:    { achtergrond: '#f0f7f0', kaart: '#1a3d2b', kaartMid: '#244f38', accent: '#f4a020' },
      herfst:   { achtergrond: '#f5ede0', kaart: '#3d2008', kaartMid: '#4e2a0e', accent: '#d4621a' },
      neutraal: { achtergrond: '#f2f2f2', kaart: '#1a1a1a', kaartMid: '#2e2e2e', accent: '#555555' },
    };

    const DEFAULT_CONFIG = {
      thema: 'pasen',
      evenement: {
        titel: 'Pasen 2026',
        subtitel: 'Bestel uw huisgemaakte salades voor Pasen. Vers bereid, af te halen in Rijssen.',
        dag: 'zaterdag 18 april',
        locatie: 'Rijssen',
        deadline: 'zondag 13 april 2026',
        badge: 'Afhalen zaterdag 18 april · 14:00 – 16:00 uur',
        formspree: 'https://formspree.io/f/PLACEHOLDER',
      },
      categorieeen: [
        { naam: 'Huzarensalade', producten: [{ naam: 'Per liter', prijs: '10.50' }, { naam: '2-persoons schaal', prijs: '16.50' }, { naam: '4-persoons schaal', prijs: '33.00' }] },
        { naam: 'Waldorfsalade', producten: [{ naam: 'Per liter', prijs: '14.00' }, { naam: '2-persoons schaal', prijs: '19.50' }, { naam: '4-persoons schaal', prijs: '39.00' }] },
      ],
      tijdslots: ['14:00 – 14:30', '14:30 – 15:00', '15:00 – 15:30', '15:30 – 16:00'],
    };

    const urlSlug = new URLSearchParams(window.location.search).get('slug');

    async function laadEnRender() {
      let cfg = DEFAULT_CONFIG;

      if (urlSlug) {
        const { data, error } = await getSbClient()
          .from('templates')
          .select('id, config')
          .eq('slug', urlSlug)
          .eq('status', 'gepubliceerd')
          .single();
        if (!error && data?.config) {
          cfg = data.config;
          window._TEMPLATE_ID = data.id;
        }
      } else {
        // Fallback: localStorage
        const opgeslagen = localStorage.getItem('brodshoes_config');
        if (opgeslagen) cfg = JSON.parse(opgeslagen);
      }

      // Als thema een UUID is (custom thema), ophalen uit Supabase
      const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(cfg.thema);
      if (isUuid) {
        const { data: themaData } = await getSbClient()
          .from('themas')
          .select('achtergrond, kaart, kaart_mid, accent')
          .eq('id', cfg.thema)
          .single();
        if (themaData) {
          THEMAS[cfg.thema] = {
            achtergrond: themaData.achtergrond,
            kaart:       themaData.kaart,
            kaartMid:    themaData.kaart_mid || themaData.kaart,
            accent:      themaData.accent,
          };
        }
      }

      pasThemaToe(cfg);
    }

    function pasThemaToe(cfg) {
      const ev = cfg.evenement;
      const thema = THEMAS[cfg.thema] || THEMAS.pasen;

      // Pas CSS variabelen aan op basis van thema
      document.documentElement.style.setProperty('--teal-dark', thema.achtergrond);
      document.documentElement.style.setProperty('--teal', thema.kaart);
      document.documentElement.style.setProperty('--teal-mid', thema.kaartMid);
      document.documentElement.style.setProperty('--red', thema.accent);
      document.documentElement.style.setProperty('--red-hover', thema.accent + 'cc');

      // Laad header/footer foto: Supabase Storage (via config) of localStorage fallback
      const headerFoto = cfg.headerFoto || localStorage.getItem(`brodshoes_foto_${cfg.thema}_header`);
      const footerFoto = cfg.footerFoto || localStorage.getItem(`brodshoes_foto_${cfg.thema}_footer`);
      if (headerFoto) document.getElementById('hero-img').src = headerFoto;
      if (footerFoto) document.getElementById('footer-img').src = footerFoto;

      // Vul evenement teksten in zodra DOM gereed is
      function vulIn() {
        document.querySelector('title').textContent = `${ev.titel} – Bestellen | Brodshoes`;
        document.getElementById('ev-titel').textContent = ev.titel;
        document.getElementById('ev-subtitel').innerHTML = ev.subtitel;
        document.getElementById('ev-badge').textContent = ev.badge;
        document.getElementById('ev-locatie-footer').textContent = ev.locatie;
        document.getElementById('ev-locatie-success-tag').textContent = `Brodshoes · ${ev.locatie}`;
        document.getElementById('ev-locatie-success').textContent = `Bevestiging verstuurd per e-mail · Brodshoes, ${ev.locatie}`;
        document.getElementById('ev-deadline').textContent = `Bestellen kan tot en met ${ev.deadline}`;

        // Bouw producten dynamisch
        const stap2 = document.getElementById('stap2-container');
        stap2.innerHTML = '';
        const PRIJZEN = {};
        const LABELS = {};
        let stapNr = 2;

        cfg.categorieeen.forEach((cat, ci) => {
          const header = document.createElement('div');
          header.className = 'section-header';
          header.innerHTML = `<h2>${cat.naam}</h2><div class="divider-line"></div>`;
          stap2.appendChild(header);

          cat.producten.forEach((prod, pi) => {
            const id = `cat${ci}_prod${pi}`;
            const prijs = parseFloat(prod.prijs) || 0;
            PRIJZEN[id] = prijs;
            LABELS[id] = `${cat.naam} – ${prod.naam}`;

            const rij = document.createElement('div');
            rij.className = 'product-rij';
            rij.innerHTML = `
              <div class="product-info">
                <div class="product-omschrijving">${prod.naam}</div>
                ${prod.omschrijving ? `<div class="product-prijs" style="font-style:italic;font-size:17px;margin-top:2px;">${prod.omschrijving}</div>` : ''}
                <div class="product-prijs" style="${prod.omschrijving ? 'margin-top:6px;' : ''}">€ ${prijs.toFixed(2).replace('.', ',')}</div>
              </div>
              <div class="qty-control">
                <button type="button" class="qty-btn" onclick="changeQty('${id}', -1)">−</button>
                <input class="qty-value" type="number" id="${id}" value="0" min="0" max="20" oninput="updateTotaal()" />
                <button type="button" class="qty-btn" onclick="changeQty('${id}', 1)">+</button>
              </div>`;
            stap2.appendChild(rij);
          });
        });

        document.getElementById('tijdslot-stap-nr').textContent = `Stap ${stapNr}`;

        const tijdslotGrid = document.getElementById('tijdslot-grid');
        tijdslotGrid.innerHTML = '';
        const tijdslotLabelEl = document.getElementById('tijdslot-label');
        tijdslotLabelEl.textContent = cfg.evenement?.dag
          ? `Kies uw afhaalmoment (${cfg.evenement.dag})`
          : 'Kies uw afhaalmoment';
        cfg.tijdslots.forEach(slot => {
          const lbl = document.createElement('label');
          lbl.className = 'tijdslot-option';
          lbl.innerHTML = `<input type="radio" name="tijdslot" value="${slot}" /><span class="tijdslot-label">${slot}</span>`;
          tijdslotGrid.appendChild(lbl);
        });
        if (cfg.tijdslots.length === 1) {
          tijdslotGrid.style.gridTemplateColumns = '1fr';
          tijdslotGrid.style.maxWidth = '260px';
          tijdslotGrid.style.margin = '0 auto';
        } else {
          tijdslotGrid.style.gridTemplateColumns = '';
          tijdslotGrid.style.maxWidth = '';
          tijdslotGrid.style.margin = '';
        }
        if (tijdslotGrid.querySelector('input[type="radio"]')) {
          // geen required — eigen validatie in handleSubmit
        }

        window._PRIJZEN = PRIJZEN;
        window._LABELS = LABELS;
        window._EV = ev;
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', vulIn);
      } else {
        vulIn();
      }
    }

    function changeQty(id, delta) {
      const el = document.getElementById(id);
      el.value = Math.max(0, Math.min(20, (parseInt(el.value) || 0) + delta));
      updateTotaal();
    }

    function updateTotaal() {
      const PRIJZEN = window._PRIJZEN || {};
      let totaal = 0;
      for (const id in PRIJZEN) {
        const el = document.getElementById(id);
        if (el) totaal += (parseInt(el.value) || 0) * PRIJZEN[id];
      }
      document.getElementById('totaal-bedrag').textContent = '€ ' + totaal.toFixed(2).replace('.', ',');
    }

    function getBestelregels() {
      const PRIJZEN = window._PRIJZEN || {};
      const LABELS = window._LABELS || {};
      const regels = [];
      for (const id in PRIJZEN) {
        const el = document.getElementById(id);
        const qty = el ? (parseInt(el.value) || 0) : 0;
        if (qty > 0) regels.push({ label: LABELS[id], qty, subtotaal: qty * PRIJZEN[id] });
      }
      return regels;
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const ev = window._EV || {};
      const regels = getBestelregels();
      if (regels.length === 0) { alert('Selecteer minimaal één product om te bestellen.'); return; }

      const tijdslotEl = document.querySelector('input[name="tijdslot"]:checked');
      if (!tijdslotEl) {
        const grid = document.getElementById('tijdslot-grid');
        const fout = document.getElementById('tijdslot-fout');
        grid.classList.add('fout');
        fout.style.display = 'block';
        grid.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      document.getElementById('tijdslot-grid').classList.remove('fout');
      document.getElementById('tijdslot-fout').style.display = 'none';
      const voornaam   = document.getElementById('voornaam').value.trim();
      const achternaam = document.getElementById('achternaam').value.trim();
      const email      = document.getElementById('email').value.trim();
      const telefoon   = document.getElementById('telefoon').value.trim();
      const adres      = document.getElementById('adres').value.trim();
      const opmerking  = document.getElementById('opmerking').value.trim();
      const tijdslot   = tijdslotEl.value;
      const totaal     = regels.reduce((s, r) => s + r.subtotaal, 0);

      const btn = document.getElementById('submit-btn');
      btn.textContent = 'Bezig met versturen…';
      btn.disabled = true;

      // Sla bestelling op in Supabase
      const { error } = await getSbClient().from('bestellingen').insert({
        template_id:   window._TEMPLATE_ID || null,
        template_slug: urlSlug || null,
        voornaam, achternaam, email, telefoon, adres,
        regels,
        totaal,
        tijdslot,
        opmerking: opmerking || null,
      });

      if (error) {
        console.error('Bestelling opslaan mislukt:', error.message);
      }

      document.getElementById('form-section').style.display = 'none';
      document.getElementById('success-section').style.display = 'block';
      document.getElementById('success-title').textContent = `Bedankt, ${voornaam}!`;

      const regelHTML = regels.map(r => `<strong>${r.qty}×</strong> ${r.label} &nbsp;·&nbsp; € ${r.subtotaal.toFixed(2).replace('.', ',')}`).join('<br>');
      document.getElementById('success-bericht').innerHTML =
        `${regelHTML}<br><br>
         <strong>Totaal: € ${totaal.toFixed(2).replace('.', ',')}</strong><br><br>
         Afhalen op <strong>${ev.dag}</strong> om <strong>${tijdslot}</strong> uur.<br>
         Een bevestiging wordt verstuurd naar <strong>${email}</strong>.`;
    }

    // Start
    laadEnRender();
  </script>
</body>
</html>
